<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer.js Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .test-container {
            margin: 20px auto;
            width: 80%;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Viewer.js PDF Preview Test</h1>
    <div class="test-container">
        <iframe src="https://docs.google.com/gview?url=https://pdfobject.com/pdf/sample-3pp.pdf&embedded=true"></iframe>
    </div>
    <p>This is a test of the Google Docs Viewer for PDF preview</p>
</body>
</html>
